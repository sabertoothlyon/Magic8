<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env([...]
<title>Magic 8 Ball</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Layout: a single ball centered on a dark table. Nothing else on the page. */
  :root {
    --bg: #0d1017;
    --bg-glow: #1a2233;
    --ball-hi: #3a3f4d;
    --ball-lo: #050608;
    --disc: #f4f5f7;
    --disc-ink: #0b0d12;
    --window: #1b2a8c;
    --window-lo: #0a1052;
    --window-ink: #dfe6ff;
    --accent: #5b7cff;
    --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --ball: min(88vw, 400px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 42%, var(--bg-glow), var(--bg) 70%);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .ball {
    appearance: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    width: var(--ball);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle at 32% 24%, rgba(255,255,255,0.28) 0, rgba(255,255,255,0) 22%),
      radial-gradient(circle at 36% 30%, var(--ball-hi), var(--ball-lo) 68%);
    box-shadow: 0 30px 50px -18px rgba(0,0,0,0.85), inset 0 -14px 30px rgba(0,0,0,0.6);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .ball:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }

  .face {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: opacity 0.45s ease;
  }
  .disc {
    background: var(--disc);
    color: var(--disc-ink);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: calc(var(--ball) * 0.34);
    line-height: 1;
    box-shadow: inset 0 -6px 14px rgba(0,0,0,0.18);
  }
  .window {
    background: radial-gradient(circle at 50% 40%, var(--window), var(--window-lo) 85%);
    color: var(--window-ink);
    box-shadow: inset 0 0 28px rgba(0,0,20,0.8), 0 0 0 4px rgba(0,0,0,0.5);
    opacity: 0;
    padding: 9%;
  }
  .ans {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: calc(var(--ball) * 0.056);
    line-height: 1.2;
    text-align: center;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .ans.long { font-size: calc(var(--ball) * 0.047); }
  .ans.short { font-size: calc(var(--ball) * 0.07); }

  .ball[data-state="answer"] .disc { opacity: 0; }
  .ball[data-state="answer"] .window { opacity: 1; }

  .ball.shaking { animation: shake 0.75s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-2deg); }
    20%, 80% { transform: translate3d(6px, -4px, 0) rotate(3deg); }
    30%, 50%, 70% { transform: translate3d(-10px, 3px, 0) rotate(-5deg); }
    40%, 60% { transform: translate3d(10px, -3px, 0) rotate(5deg); }
  }
  .ball.shaking .face { opacity: 0; transition-duration: 0.15s; }

  @media (prefers-reduced-motion: reduce) {
    .ball.shaking { animation: none; }
    .face { transition: none; }
  }
</style>

<button class="ball" id="ball" type="button" data-state="idle" aria-label="Magic 8 ball. Shake the phone or activate this button for an answer.">
  <span class="face disc" aria-hidden="true">8</span>
  <span class="face window"><p class="ans" id="ans" aria-live="polite"></p></span>
</button>

<script>
  var ANSWERS = [
    "Ew, next question.",
    "Oh sweetie. No.",
    "Read the room. No.",
    "That's a choice. A bad one.",
    "Bless your heart, no.",
    "Bold of you to assume that's an option.",
    "The audacity of you even asking.",
    "Is this a prank?",
    "Who hurt you?",
    "Do you hear yourself right now?",
    "Not today, Satan.",
    "Touch grass and try again.",
    "Major ick.",
    "Not the vibe.",
    "Delulu is not the solulu here.",
    "The math ain't mathing.",
    "Girl, be so for real right now.",
    "Negative aura points for even asking.",
    "Bombastic side eye.",
    "It's a chop.",
    "Respectfully, no. Disrespectfully, also no.",
    "Say less.",
    "Bet.",
    "It's giving yes.",
    "We're so back.",
    "Ate and left no crumbs.",
    "You understood the assignment.",
    "Slay. Proceed.",
    "Main character energy. Yes.",
    "Bestie, yes.",
    "Vibes are immaculate. Yes.",
    "No notes. Perfection.",
    "Let him cook.",
    "Let me marinate on that.",
    "The jury is still out.",
    "Vibes are inconclusive.",
    "Lowkey maybe, highkey unsure.",
    "I need more lore before I decide.",
    "Convince me.",
    "Ask me in three to five business days."
  ];

  var ball = document.getElementById("ball");
  var ans = document.getElementById("ans");
  var last = -1;
  var busy = false;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function pick() {
    var i;
    do { i = Math.floor(Math.random() * ANSWERS.length); } while (i === last);
    last = i;
    return ANSWERS[i];
  }

  function reveal() {
    var text = pick();
    ans.textContent = text;
    ans.className = "ans" + (text.length > 30 ? " long" : text.length < 16 ? " short" : "");
    ball.setAttribute("data-state", "answer");
    ball.classList.remove("shaking");
    busy = false;
  }

  function shake() {
    if (busy) return;
    busy = true;
    ball.setAttribute("data-state", "idle");
    if (reduced) { setTimeout(reveal, 250); return; }
    ball.classList.remove("shaking");
    void ball.offsetWidth;
    ball.classList.add("shaking");
    setTimeout(reveal, 750);
  }

  /* Shake detection: sums the jump in acceleration between readings. */
  var lx = null, ly = null, lz = null, lastShake = 0, listening = false;
  function onMotion(e) {
    var a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    if (lx !== null) {
      var jolt = Math.abs(a.x - lx) + Math.abs(a.y - ly) + Math.abs(a.z - lz);
      var now = Date.now();
      if (jolt > 28 && now - lastShake > 1200) { lastShake = now; shake(); }
    }
    lx = a.x; ly = a.y; lz = a.z;
  }
  function listen() {
    if (listening) return;
    listening = true;
    try { window.addEventListener("devicemotion", onMotion); } catch (err) {}
  }

  /* Android and desktop browsers allow motion events outright. iPhones ask once, on a tap. */
  var needsAsk = false;
  try { needsAsk = typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"; } catch (err) {}
  if (!needsAsk) listen();

  ball.addEventListener("click", function () {
    if (needsAsk) {
      needsAsk = false;
      try {
        DeviceMotionEvent.requestPermission().then(function (r) { if (r === "granted") listen(); }).catch(function () {});
      } catch (err) {}
    }
    shake();
  });
</script>

</body></html>
